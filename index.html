<style>
/* Layout: a scoreboard-style masthead, a tab strip, then one working view at a time (standings, matchups, teams, model). */
:root {
  --paper: #f3f5f1;
  --surface: #fcfcfb;
  --ink: #111512;
  --ink-2: #4b524c;
  --muted: #7d847e;
  --rule: #dde1da;
  --rule-strong: #c4c9c1;
  --line-quiet: #c9cdc6;
  --accent: #1d5b47;
  --accent-ink: #ffffff;
  --team-a: #2a78d6;
  --team-b: #eb6834;
  --team-a-wash: rgba(42,120,214,.14);
  --team-b-wash: rgba(235,104,52,.14);
  --div-pos: #2a78d6;
  --div-neg: #e34948;
  --div-mid: #f0efec;
  --good: #006300;
  --bad: #b52f2f;
  --t0: #2a78d6; --t1: #eb6834; --t2: #1baf7a; --t3: #eda100; --t4: #e87ba4; --t5: #008300; --t6: #6250d6; --t7: #e34948; --t8: #0e8a9c; --t9: #8b5a2b; --t10: #5c6b7d; --t11: #9a9a10;
  --font-display: "Barlow Condensed", "Arial Narrow", system-ui, sans-serif;
  --font-body: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
}

  --paper: #0f1210; --surface: #171a18; --ink: #eef0ec; --ink-2: #c0c6bf; --muted: #8b918a;
  --rule: #2a2f2b; --rule-strong: #3a403b; --line-quiet: #3d433e; --accent: #5fb391; --accent-ink: #0b1510;
  --team-a: #3987e5; --team-b: #d95926; --team-a-wash: rgba(57,135,229,.2); --team-b-wash: rgba(217,89,38,.2);
  --div-pos: #3987e5; --div-neg: #e66767; --div-mid: #383835; --good: #3dbb3d; --bad: #ef7d7d; --t0: #3987e5; --t1: #d95926; --t2: #199e70; --t3: #c98500; --t4: #d55181; --t5: #2f9e2f; --t6: #9085e9; --t7: #e66767; --t8: #2bb0c2; --t9: #b07a45; --t10: #8797aa; --t11: #b8b830;
  color-scheme: dark } }
:root[data-theme="dark"] {
  --paper: #0f1210; --surface: #171a18; --ink: #eef0ec; --ink-2: #c0c6bf; --muted: #8b918a;

  --team-a: #3987e5; --team-b: #d95926; --team-a-wash: rgba(57,135,229,.2); --team-b-wash: rgba(217,89,38,.2);
  --div-pos: #3987e5; --div-neg: #e66767; --div-mid: #383835; --good: #3dbb3d; --bad: #ef7d7d; --t0: #3987e5; --t1: #d95926; --t2: #199e70; --t3: #c98500; --t4: #d55181; --t5: #2f9e2f; --t6: #9085e9; --t7: #e66767; --t8: #2bb0c2; --t9: #b07a45; --t10: #8797aa; --t11: #b8b830;
  color-scheme: dark }

* { box-sizing: border-box; }
[hidden] { display: none !important; }
body { background: var(--paper); color: var(--ink); font-family: var(--font-body); font-size: 15px; line-height: 1.5; }
.wrap { max-width: 1080px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 28px 64px; }
h1, h2, h3 { font-family: var(--font-display); font-weight: 700; letter-spacing: .01em; margin: 0; text-wrap: balance; line-height: 1.05; }
h1 { font-size: clamp(2.4rem, 6vw, 3.6rem); text-transform: uppercase; letter-spacing: .02em; }

p { margin: 0; }
.num { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }

.muted { color: var(--muted); }
.ink2 { color: var(--ink-2); }

/* masthead */
.mast { display: grid; grid-template-columns: 1fr auto; gap: 12px 24px; align-items: end; border-bottom: 3px solid var(--ink); padding-bottom: 14px; }
.mast-title { display: flex; align-items: end; gap: 14px; min-width: 0; }

.seasonbar nav.tabs { margin: 0; }

.meta { display: flex; flex-wrap: wrap; gap: 6px 18px; color: var(--ink-2); font-size: .9rem; }
.meta b { font-weight: 600; color: var(--ink); }
.seg { display: inline-flex; border: 1px solid var(--rule-strong); border-radius: 6px; overflow: hidden; background: var(--surface); }
.seg button { font: 500 .85rem var(--font-body); padding: 6px 12px; border: 0; background: transparent; color: var(--ink-2); cursor: pointer; }
.seg button + button { border-left: 1px solid var(--rule-strong); }

nav.tabs { display: flex; gap: 4px; margin: 18px 0 26px; overflow-x: auto; scrollbar-width: none; }
nav.tabs a { font-family: var(--font-display); font-weight: 600; font-size: 1.15rem; text-transform: uppercase; letter-spacing: .06em; padding: 6px 14px 4px; color: var(--ink-2); text-decoration: none; border-radius: 4px; white-space: nowrap; }

.sec-head { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: end; gap: 10px 20px; }
.sec-head p { color: var(--ink-2); max-width: 62ch; }
.panel { background: var(--surface); border: 1px solid var(--rule); border-radius: 8px; }

/* standings table */
.tbl-wrap { overflow-x: auto; }

.standings th { font-family: var(--font-display); font-weight: 600; text-transform: uppercase; letter-spacing: .08em; font-size: .82rem; color: var(--muted); text-align: left; padding: 10px 10px 8px; border-bottom: 1px solid var(--rule-strong); white-space: nowrap; }

.dot { display: inline-block; width: 9px; height: 9px; border-radius: 50%; margin-right: 8px; vertical-align: 1px; }

.delta.up { color: var(--good); } .delta.down { color: var(--bad); } .delta.flat { color: var(--muted); }
.pbar { display: grid; grid-template-columns: 3.2em 56px; align-items: center; gap: 8px; justify-content: end; }
.pbar .track { height: 6px; background: var(--rule); border-radius: 3px; overflow: hidden; }
.pbar .fill { height: 100%; background: var(--ink-2); border-radius: 3px; }
.pbar.title .fill { background: var(--accent); }
.pbar span { text-align: right; }

/* charts */
.chart { position: relative; }
.chart svg { display: block; width: 100%; height: auto; overflow: visible; }
.axis text, .chart text { fill: var(--muted); font-family: var(--font-mono); font-size: 11px; }
.grid line { stroke: var(--rule); stroke-width: 1; }
.tip { position: absolute; pointer-events: none; background: var(--surface); border: 1px solid var(--rule-strong); border-radius: 6px; padding: 8px 10px; font-size: .8rem; box-shadow: 0 6px 18px rgba(0,0,0,.12); min-width: 180px; z-index: 5; }

.tip .rowt { display: flex; justify-content: space-between; gap: 14px; }
.tip .rowt.hl { font-weight: 600; }
.legend { display: flex; flex-wrap: wrap; gap: 6px 18px; font-size: .85rem; color: var(--ink-2); }
.legend .sw { display: inline-block; width: 18px; height: 3px; border-radius: 2px; vertical-align: middle; margin-right: 6px; }
.chart-panel { padding: 16px 16px 10px; display: grid; gap: 10px; }

/* matchups */
.weekbar { display: flex; gap: 4px; overflow-x: auto; padding-bottom: 4px; scrollbar-width: thin; }
.weekbar button { flex: 0 0 auto; min-width: 40px; font: 500 .85rem var(--font-mono); padding: 6px 8px; border-radius: 4px; border: 1px solid var(--rule-strong); background: var(--surface); color: var(--ink-2); cursor: pointer; }
.weekbar button.done { color: var(--ink); }

.cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 330px), 1fr)); gap: 14px; }
.card { padding: 14px 16px 12px; display: grid; gap: 10px; min-width: 0; }
.card .vs { display: grid; grid-template-columns: 1fr auto 1fr; gap: 8px; align-items: start; }
.card .vs .nm { font-weight: 600; line-height: 1.25; overflow-wrap: anywhere; }
.card .vs .nm.b { text-align: right; }
.card .vs .pct { font-family: var(--font-display); font-weight: 700; font-size: 1.6rem; line-height: 1; }
.card .vs .pa { color: var(--team-a); } .card .vs .pb { color: var(--team-b); text-align: right; }
.splitbar { display: flex; height: 8px; border-radius: 4px; overflow: hidden; gap: 2px; }
.splitbar i { display: block; height: 100%; }
.splitbar .t { background: var(--line-quiet); }
.splitbar .a { background: var(--team-a); border-radius: 4px 0 0 4px; } .splitbar .b { background: var(--team-b); border-radius: 0 4px 4px 0; }
.chip { display: inline-block; font-family: var(--font-display); font-weight: 600; text-transform: uppercase; letter-spacing: .08em; font-size: .75rem; padding: 2px 8px; border-radius: 999px; border: 1px solid var(--rule-strong); color: var(--ink-2); }
.chip.live { border-color: var(--accent); color: var(--accent); }
.chip.hit { border-color: var(--good); color: var(--good); }
.chip.miss { border-color: var(--bad); color: var(--bad); }
.cardmeta { display: flex; justify-content: space-between; align-items: center; gap: 8px; font-size: .82rem; color: var(--ink-2); flex-wrap: wrap; }
.cats { display: grid; grid-template-columns: 4.6em 1fr 4.2em 4.6em; gap: 3px 8px; align-items: center; font-size: .82rem; }
.cats .c { font-family: var(--font-display); font-weight: 600; letter-spacing: .06em; color: var(--muted); text-align: center; }
.cats .va { text-align: left; } .cats .vb { text-align: right; }
.cats .win { color: var(--ink); font-weight: 600; } .cats .lose { color: var(--muted); }
.cats .mini { height: 5px; background: var(--team-b); border-radius: 3px; overflow: hidden; }
.cats .mini i { display: block; height: 100%; background: var(--team-a); border-right: 2px solid var(--surface); }
.cats .pp { text-align: right; color: var(--muted); }
.cats-head { font-size: .72rem; color: var(--muted); }

/* teams */
.teamgrid { display: grid; grid-template-columns: minmax(0, 1.1fr) minmax(0, 1fr); gap: 18px; align-items: start; }
@media (max-width: 760px) { .teamgrid { grid-template-columns: 1fr; } }
.pickers { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.pickers label { display: flex; align-items: center; gap: 8px; font-size: .85rem; color: var(--ink-2); }
select { font: 500 .9rem var(--font-body); padding: 6px 8px; border-radius: 6px; border: 1px solid var(--rule-strong); background: var(--surface); color: var(--ink); max-width: 100%; }
.cmp th, .cmp td { padding: 7px 8px; border-bottom: 1px solid var(--rule); font-size: .85rem; white-space: nowrap; }
.cmp th { font-family: var(--font-display); font-weight: 600; text-transform: uppercase; letter-spacing: .08em; font-size: .78rem; color: var(--muted); text-align: right; }
.cmp th:first-child, .cmp td:first-child { text-align: left; }
.cmp td { text-align: right; }
.cmp .ca { color: var(--team-a); } .cmp .cb { color: var(--team-b); }
.heat th { font-family: var(--font-display); font-weight: 600; letter-spacing: .06em; font-size: .8rem; color: var(--muted); padding: 8px 4px; text-align: center; white-space: nowrap; }
.heat th:first-child { text-align: left; }
.heat td { padding: 2px; }
.heat td.nm { padding: 4px 10px 4px 0; font-weight: 500; font-size: .85rem; white-space: nowrap; cursor: pointer; }
.heat td.nm:hover { text-decoration: underline; }
.heat .cell { border-radius: 3px; text-align: center; font-family: var(--font-mono); font-size: .78rem; padding: 6px 0; min-width: 40px; }

/* model */
.prose { display: grid; gap: 12px; max-width: 68ch; color: var(--ink-2); }
.prose h3 { color: var(--ink); margin-top: 10px; }
.prose b { color: var(--ink); font-weight: 600; }
.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 200px), 1fr)); gap: 14px; }
.stat { padding: 14px 16px; display: grid; gap: 2px; }
.stat .big { font-family: var(--font-display); font-weight: 700; font-size: 2.2rem; line-height: 1; }
.loading { color: var(--muted); font-size: .9rem; padding: 20px 0; }
.note { font-size: .82rem; color: var(--muted); }
@media (max-width: 560px) {
  .mast { grid-template-columns: 1fr; }
  .seasonbar { grid-template-columns: 1fr; }
  .hide-sm { display: none; }
}
.tl g.team { transition: opacity .15s; }
.tl.has-hl g.team { opacity: .16; }
.tl.has-hl g.team.on { opacity: 1; }
.tl g.team.on .ln { stroke-width: 3.5; }
.tl .lb { fill: var(--ink-2); font-family: var(--font-body); font-size: 11.5px; }
.tl .lb .v { fill: var(--muted); font-family: var(--font-mono); font-size: 11px; }
.tl g.team.on .lb { fill: var(--ink); font-weight: 600; }
.tl .hitln, .tl .hitlb { cursor: pointer; pointer-events: all; }
.standings tr.sel td { background: color-mix(in srgb, var(--accent) 12%, transparent); }
.legend .sw.dash { background: none; border-top: 2px dashed var(--muted); height: 0; }
.cmp .rk { color: var(--muted); font-size: .78rem; text-align: left; padding-left: 2px; }
.heat .cell.avg { background: transparent; color: var(--ink-2); }
.tip .dot { width: 8px; height: 8px; margin-right: 6px; }
.standings .caret { color: var(--muted); margin-left: 8px; font-size: .8rem; }
.standings tr.detail td { background: var(--paper); padding: 16px 16px 12px; white-space: normal; cursor: default; }
.dist { display: grid; gap: 10px; }
.dist-head { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: end; gap: 8px 20px; }
.dist-head p { max-width: 60ch; margin-top: 4px; }
.dist-head b { color: var(--ink); font-weight: 600; }
.legend .sw.blk { width: 12px; height: 12px; border-radius: 2px; }
.hitbar { cursor: default; }
/* mascot: an original DuffCast player dribbling, in the site's team colors */
.mascot { display: inline-block; flex: none; }
.with-mascot { display: flex; align-items: end; gap: 14px; }
.mascot { width: 80px; }
.mascot svg { display: block; width: 100%; height: auto; overflow: visible; }
.mascot .ball { transform-box: fill-box; transform-origin: 50% 100%; animation: bounce .62s infinite; }
.mascot .shadow { transform-box: fill-box; transform-origin: 50% 50%; animation: shade .62s infinite; }
.mascot .arm { transform-box: view-box; transform-origin: 72px 64px; animation: flap .62s infinite; }
.mascot .pony { transform-box: view-box; transform-origin: 46px 24px; animation: swing .62s infinite; }
.mascot .bob { animation: bob .62s infinite; }
.mascot.run .runner { animation: run 7s linear infinite; }
@keyframes bounce { 0%,100% { transform: translateY(-50px); animation-timing-function: ease-in; } 46% { transform: translateY(0) scale(1.08, .86); animation-timing-function: ease-out; } 54% { transform: translateY(0) scale(1, 1); } }
@keyframes shade { 0%,100% { transform: scale(.55); opacity: .25; } 50% { transform: scale(1); opacity: .45; } }
@keyframes flap { 0%,100% { transform: rotate(-22deg); } 46% { transform: rotate(6deg); } }
@keyframes swing { 0%,100% { transform: rotate(-6deg); } 50% { transform: rotate(5deg); } }
@keyframes bob { 0%,100% { transform: translateY(0); } 50% { transform: translateY(2px); } }
@keyframes run { 0% { left: 0; transform: scaleX(1); } 49% { left: calc(100% - 90px); transform: scaleX(1); } 50% { left: calc(100% - 90px); transform: scaleX(-1); } 99% { left: 0; transform: scaleX(-1); } 100% { left: 0; transform: scaleX(1); } }
.mascot.run { display: block; position: relative; width: 100%; height: 104px; overflow: hidden; }
.mascot.run .runner { position: absolute; bottom: 0; left: 0; width: 90px; }
@media (prefers-reduced-motion: reduce) { .mascot .ball, .mascot .shadow, .mascot .arm, .mascot .pony, .mascot .bob, .mascot.run .runner { animation: none; } }
.score th { font-family: var(--font-display); font-weight: 600; text-transform: uppercase; letter-spacing: .08em; font-size: .85rem; color: var(--muted); text-align: right; padding: 12px 14px 8px; border-bottom: 1px solid var(--rule-strong); }
.score th:first-child, .score td:first-child { text-align: left; }
.score td { padding: 10px 14px; border-bottom: 1px solid var(--rule); text-align: right; vertical-align: top; }
.score td:first-child { font-weight: 600; min-width: 200px; }
.score .sub { display: block; font-weight: 400; font-size: .8rem; color: var(--muted); }
.score tr.key td { font-size: 1.15rem; }
.score tr.key td:first-child { font-size: 1rem; }
.score .good { color: var(--good); font-weight: 600; } .score .bad { color: var(--bad); font-weight: 600; }
.teapicks { display: flex; flex-wrap: wrap; gap: 6px; }
.teapicks button { font: 500 .85rem var(--font-body); padding: 6px 10px; border-radius: 999px; border: 1px solid var(--rule-strong); background: var(--surface); color: var(--ink-2); cursor: pointer; display: inline-flex; align-items: center; }
.teapicks button .dot { margin-right: 6px; }

.teacard { padding: 20px 22px; display: grid; gap: 18px; }

.tea-line { margin-top: 6px; font-size: 1.05rem; color: var(--ink-2); max-width: 52ch; }
.tea-stats { display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center; color: var(--ink-2); font-size: .9rem; }
.tea-stats b { color: var(--ink); font-size: 1.1rem; }
.chip.tier-contender { border-color: var(--good); color: var(--good); }
.chip.tier-mix { border-color: var(--accent); color: var(--accent); }

.tea-grid h4 { font-family: var(--font-display); font-weight: 600; text-transform: uppercase; letter-spacing: .1em; font-size: .9rem; color: var(--muted); margin: 0 0 8px; }

const DRIFT = Math.sqrt((1 - DECAY) ** 2 / DECAY);   // weeks of league-average usage blended into each team's usage rate
const SQ2 = Math.SQRT2;

const avg = a => a.reduce((x,y)=>x+y,0)/a.length;

function catVal(s, i){
  const c = CATS[i];
  if (c === 'FG%' && s.FGA) return s.FGM/s.FGA;
  if (c === 'FT%' && s.FTA) return s.FTM/s.FTA;

// ---------- data prep ----------
function prep(season){

  const weeks = {};
  season.matchups.forEach(m => (weeks[m.week] ||= []).push(m));

  while (weeks[lastFinal+1] && weeks[lastFinal+1].every(m => m.sa && m.final)) lastFinal++;

  // Games per team per week: actually played for finished weeks; for future weeks, scheduled games for healthy
  // players (injured players back on their expected return date) plus a 75%-strength streamer when the IR spot is open.
  // Without it, every team counts as 1.

  // games: the projection made before each week started, used for every forecast, so past odds never peek ahead.
  const played = (t, w) => season.games && season.games[t] && season.games[t][w-1] ? season.games[t][w-1] : 1;
  const games = (t, w) => season.gamesPlanned && season.gamesPlanned[t] && season.gamesPlanned[t][w-1] ? season.gamesPlanned[t][w-1] : played(t, w);
  const gbar = w => avg([...Array(T).keys()].map(t => games(t, w)));

  for (let w = 1; w <= lastFinal; w++) {
    const v = Array(T).fill(null);
    weeks[w].forEach(m => { v[m.a] = CATS.map((_,i)=>catVal(m.sa,i)); v[m.b] = CATS.map((_,i)=>catVal(m.sb,i)); });
    vals[w] = v;

    obs[w] = rate.map(x => x && x.map((y, i) => y / lmean[w][i]));
    results[w] = weeks[w].map(m => scoreMatch(m.a, m.b, v[m.a], v[m.b]));

  // typical per-game (counting) or raw (percent) league value; multiply by games for a week's total
  const typical = CATS.map((_,i) => lastFinal ? avg(Object.values(lmean).map(x => x[i])) : null);
  const gTypical = lastFinal ? avg([...Array(lastFinal).keys()].map(k => gbar(k+1))) : 1;
  return { season, T, weeks, lastFinal, live, vals, lmean, obs, results, typical, games, played, gbar, gTypical, cache: {} };
}
function scoreMatch(a, b, va, vb){
  let ca = 0, cb = 0; const cat = [];
  for (let i = 0; i < NC; i++) {
    const d = (va[i] - vb[i]) * SGN[i];
    const r = Math.abs(d) < 1e-9 ? 0 : (d > 0 ? 1 : -1);
    cat.push(r); if (r > 0) ca++; else if (r < 0) cb++;

// ---------- the model ----------
// A team's strength in a category = its per-game rate divided by the league's per-game average that week
// (percentages compare directly). Recent weeks count more (0.8 per week of age). Estimates are pulled toward
// average (1.0) in proportion to how noisy the category is relative to how much teams truly differ.
function estimate(P, asOf){
  if (P.cache['e'+asOf]) return P.cache['e'+asOf];
  const mu = [], se = [];
  for (let t = 0; t < P.T; t++) {
    mu.push([]); se.push([]);
    for (let i = 0; i < NC; i++) {
      let sw = 0, swx = 0;
      for (let w = 1; w <= asOf; w++) {
        const o = P.obs[w][t]; if (!o) continue;
        const wt = Math.pow(DECAY, asOf - w);
        sw += wt; swx += wt * o[i];
      }
      const prec = 1/(TAU[i]*TAU[i]) + sw/(SIG[i]*SIG[i]);
      mu[t].push((1/(TAU[i]*TAU[i]) + swx/(SIG[i]*SIG[i])) / prec);
      se[t].push(Math.sqrt(1/prec));
    }

  // weighted toward recent weeks and pulled toward average. Managers who stream and fill lineups keep doing it.
  const usage = [...Array(P.T).keys()].map(t => {
    let s = USAGE_PRIOR, sw = USAGE_PRIOR;
    for (let w = 1; w <= asOf; w++) {

      const wt = Math.pow(DECAY, asOf - w);
      s += wt * (P.played(t, w) / P.games(t, w)) / lg; sw += wt;

}
// Games factor: a team's expected games (usage rate × scheduled games) relative to the league that week.
// w = null means a typical week.
const gfac = (P, E, t, w, i) => {
  if (!COUNT[i] || w == null || w > P.season.regWeeks) return 1;
  const lg = avg([...Array(P.T).keys()].map(u => E.usage[u] * P.games(u, w)));
  return E.usage[t] * P.games(t, w) / lg;
};
// A projected weekly total (or percentage) for display.
function projVal(P, E, t, i, w){
  if (P.typical[i] == null) return null;
  if (!COUNT[i]) return E.mu[t][i] * P.typical[i];
  const g = ((w == null || w > P.season.regWeeks) ? P.gTypical : P.games(t, w)) * E.usage[t];
  return E.mu[t][i] * P.typical[i] * g;
}
// Chance of a tie in a counting category: density of the difference at zero, for a one-unit gap.
function tieProb(P, i, z, sd, w, weeksLen = 1){
  if (!COUNT[i] || P.typical[i] == null) return 0;
  const g = (w == null || w > P.season.regWeeks) ? P.gTypical : P.gbar(w);
  const units = sd * P.typical[i] * g * weeksLen;
  return Math.min(.2, pdf(z) / units);
}
function catOdds(P, E, a, b, w){
  return CATS.map((_, i) => {
    const fa = gfac(P, E, a, w, i), fb = gfac(P, E, b, w, i);
    const sd = Math.sqrt(2*SIG[i]*SIG[i] + (E.se[a][i]*fa)**2 + (E.se[b][i]*fb)**2);
    const z = SGN[i] * (E.mu[a][i]*fa - E.mu[b][i]*fb) / sd;
    const pc = phi(z), pt = tieProb(P, i, z, sd, w);
    const pw = Math.max(0, pc - pt/2), pl = Math.max(0, 1 - pc - pt/2);
    return [pw, 1 - pw - pl, pl];
  });
}
function outcome(odds){ // win / tie / loss of the week from per-category [win, tie, loss]
  let dp = new Map([[0, 1]]);
  odds.forEach(([pw, pt, pl]) => {
    const n = new Map();
    dp.forEach((v, k) => { n.set(k+1, (n.get(k+1)||0) + v*pw); n.set(k, (n.get(k)||0) + v*pt); n.set(k-1, (n.get(k-1)||0) + v*pl); });
    dp = n;
  });
  let win = 0, tie = 0, loss = 0; dp.forEach((v, k) => { if (k > 0) win += v; else if (k < 0) loss += v; else tie += v; });
  return { win, tie, loss };
}
function matchupProb(P, E, a, b, w){
  const odds = catOdds(P, E, a, b, w), o = outcome(odds);
  return { odds, ps: odds.map(x => x[0] + x[1]/2), p: o.win, tie: o.tie, q: o.loss,

function simulate(P, asOf, N, seed, withDist){

    baseC[m.a] += m.ca; baseC[m.b] += m.cb;
    if (m.res === 'A') { baseW[m.a]++; baseL[m.b]++; } else if (m.res === 'B') { baseW[m.b]++; baseL[m.a]++; } else { baseT[m.a]++; baseT[m.b]++; }
  });
  const rem = [];
  for (let w = asOf+1; w <= reg; w++) (P.weeks[w] || []).forEach(m => rem.push({ w, a: m.a, b: m.b,
    fa: CATS.map((_, i) => gfac(P, E, m.a, w, i)), fb: CATS.map((_, i) => gfac(P, E, m.b, w, i)),
    tu: CATS.map((_, i) => COUNT[i] && P.typical[i] != null ? SQ2*SIG[i]*P.typical[i]*P.gbar(w) : 0) }));
  const sumW = Array(T).fill(0), sumT = Array(T).fill(0), po = Array(T).fill(0), title = Array(T).fill(0), seed1 = Array(T).fill(0);
  const dist = Array.from({length:T}, () => Array.from({length: reg+1}, () => [0, 0]));
  const s = Array.from({length:T}, () => Array(NC).fill(0));
  const W = Array(T), Ti = Array(T), C = Array(T), order = [...Array(T).keys()];
  const nPO = P.season.playoffTeams;
  const catResult = (x, tu) => { // x: standardized edge for A; returns 1 A, 0 tie, -1 B
    const pc = phi(x), pt = tu ? Math.min(.2, pdf(x) / tu) : 0, u = r();

    let cw = asOf;
    const drift = steps => { const k = DRIFT * Math.sqrt(steps); for (let t = 0; t < T; t++) for (let i = 0; i < NC; i++) s[t][i] += k * SIG[i] * gauss(r); };
    for (const m of rem) {

      let ca = 0, cb = 0;
      for (let i = 0; i < NC; i++) {
        const k = catResult(SGN[i]*(s[m.a][i]*m.fa[i] - s[m.b][i]*m.fb[i])/(SQ2*SIG[i]), m.tu[i]);
        if (k > 0) ca++; else if (k < 0) cb++;

    };

    projW: sumW[t]/N, projT: sumT[t]/N, projL: reg - (sumW[t] + sumT[t])/N, po: po[t]/N, title: title[t]/N, seed1: seed1[t]/N,
    ...(withDist ? { dist: dist[t] } : {}) }));
}
function backtest(P){

    const E = estimate(P, w);

      const pr = matchupProb(P, E, m.a, m.b, w+1), p = pr.p / (pr.p + pr.q), y = m.res === 'A' ? 1 : 0;
      n++; brier += (p - y)**2;
      if ((p >= .5) === (y === 1)) hit++;
      if (Math.abs(p - .5) >= .2) { conf++; if ((p >= .5) === (y === 1)) confHit++; }
    });
  }
  return { n, hit, brier: n ? brier/n : null, conf, confHit };
}
/*END ENGINE*/

const $ = (s, r=document) => r.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pct = (p, d=0) => (p*100).toFixed(d) + '%';

// Forecasts are simulated once a week and frozen into the data, so every viewer sees the same numbers
// and past weeks keep what the model said at the time.
function history(P){
  if (P.cache.hist) return P.cache.hist;
  return (P.cache.hist = (P.season.snaps || []).map((snap, w) => {
    const rec = P.season.teams.map(() => ({ w: 0, l: 0, ti: 0 }));
    for (let k = 1; k <= w; k++) P.results[k].forEach(m => {
      if (m.res === 'A') { rec[m.a].w++; rec[m.b].l++; } else if (m.res === 'B') { rec[m.b].w++; rec[m.a].l++; } else { rec[m.a].ti++; rec[m.b].ti++; }
    });
    return snap.teams.map((x, t) => ({ t, name: P.season.teams[t], ...rec[t], ...x, projL: P.season.regWeeks - x.projW - x.projT }));
  }));
}

// ---------- standings ----------
const teamColor = t => `var(--t${t})`;
function viewStandings(el){
  const p = P(), hist = history(p), now = hist[p.lastFinal], prev = p.lastFinal ? hist[p.lastFinal-1] : null;
  const byProj = arr => [...arr].sort((x,y) => y.projW - x.projW || y.title - x.title);
  const rows = byProj(now);
  const prevRank = {}; if (prev) byProj(prev).forEach((r, k) => prevRank[r.t] = k + 1);
  const since = p.lastFinal > 1 ? `the forecast after week ${p.lastFinal - 1}` : 'the preseason forecast';
  const nPO = p.season.playoffTeams;
  const fmtRec = r => `${r.w}–${r.l}${r.ti ? '–' + r.ti : ''}`;
  // Whole-number projected record. Future ties are rare (about one in 40 matchups), so they're split half and half
  // into wins and losses; ties that already happened stay in the record.
  const projRec = r => {
    const extra = Math.max(0, r.projT - r.ti) / 2, reg = p.season.regWeeks;
    const w = Math.round(r.projW + extra), l = reg - r.ti - w;
    return `${w}–${l}${r.ti ? '–' + r.ti : ''}`;
  };
  el.innerHTML = `
  <section class="section">
    <div class="sec-head">

      <table class="standings">
        <thead><tr><th colspan="2" title="Projected finish, with places moved since ${since}">Rank</th><th>Team</th><th class="r">Record</th><th class="r">Proj. record</th><th class="r wrap" title="Change in projected wins since ${since}">Wins vs. last week</th><th class="r">Playoffs</th><th class="r">Title</th></tr></thead>
        <tbody>${rows.map((r, k) => {
          const pr = prev ? prev[r.t].projW : null, d = pr == null ? null : r.projW - pr;
          const dcls = d == null || Math.abs(d) < .05 ? 'flat' : d > 0 ? 'up' : 'down';
          const dtxt = d == null ? '—' : Math.abs(d) < .05 ? '±0.0' : (d > 0 ? '▲ ' : '▼ ') + Math.abs(d).toFixed(1);
          const open = r.t === state.open;
          return `<tr class="row${k === nPO-1 && !open ? ' cut' : ''}${r.t === state.hl ? ' sel' : ''}" tabindex="0" data-t="${r.t}" aria-expanded="${open}">
            <td class="rank">${k+1}</td>
            <td class="mv">${(() => { const m = prevRank[r.t] ? prevRank[r.t] - (k+1) : 0; return !prev ? '' : m > 0 ? `<span class="delta up" title="Up ${m} since ${since}">▲${m}</span>` : m < 0 ? `<span class="delta down" title="Down ${-m} since ${since}">▼${-m}</span>` : `<span class="delta flat" title="Same place as ${since}">–</span>`; })()}</td>
            <td class="team"><span class="dot" style="background:${teamColor(r.t)}"></span>${esc(r.name)}<span class="caret" aria-hidden="true">${open ? '▾' : '▸'}</span></td>
            <td class="r num">${fmtRec(r)}</td>
            <td class="r num" title="Average across simulations: ${r.projW.toFixed(1)} wins, ${r.projL.toFixed(1)} losses, ${r.projT.toFixed(1)} ties">${projRec(r)}</td>
            <td class="r"><span class="delta ${dcls}" title="Change in projected wins since ${since}">${dtxt}</span></td>
            <td class="r"><div class="pbar"><span class="num">${pct(r.po)}</span><div class="track"><div class="fill" style="width:${r.po*100}%"></div></div></div></td>
            <td class="r"><div class="pbar title"><span class="num">${pct(r.title)}</span><div class="track"><div class="fill" style="width:${r.title*100}%"></div></div></div></td>
          </tr>${open ? `<tr class="detail${k === nPO-1 ? ' cut' : ''}"><td colspan="8"><div class="dist" id="dist"></div></td></tr>` : ''}`; }).join('')}</tbody>
      </table>
    </div>
    <p class="note">Dashed line marks the playoff cut. Record is wins, losses and ties by weekly matchup, as ESPN counts them.</p>
  </section>
  <section class="section">
    <div class="sec-head">
      <div><div class="eyebrow">Model over time</div><h2>Projected wins</h2></div>
      <p>Where the model expected each team to finish after every week. Hover a line or name to pick it out; click one to keep it highlighted.</p>
    </div>
    <div class="panel chart-panel"><div class="chart tl" id="tlWins"></div></div>
  </section>
  <section class="section">
    <div class="sec-head">
      <div><div class="eyebrow">Model over time</div><h2>Playoff odds</h2></div>
      <p>Each team's chance of finishing in the top ${nPO}, after every week.</p>
    </div>
    <div class="panel chart-panel"><div class="chart tl" id="tlPO"></div></div>
    <p class="note">"Pre" is the preseason starting point. Every team is rated league-average there, so the differences come only from how many games each team has scheduled. Each later point uses only results known at the end of that week, and is frozen once it's published.</p>
  </section>`;
  const lock = t => { state.hl = state.hl === t ? null : t; viewStandings(el); };
  const toggle = t => { if (state.open === t) { state.open = null; state.hl = null; } else { state.open = t; state.hl = t; } viewStandings(el); };
  el.querySelectorAll('tr.row').forEach(tr => {

// Distribution of final win totals across all simulated seasons, split by whether the team made the playoffs.
function drawDist(host, p, t, row){
  const bins = p.season.dist[t], N = bins.reduce((s, b) => s + b[0], 0), reg = p.season.regWeeks;
  const share = bins.map(b => b[0] / N), maxS = Math.max(...share);
  let lo = bins.findIndex(b => b[0] > 0), hi = bins.length - 1 - [...bins].reverse().findIndex(b => b[0] > 0);
  lo = Math.max(0, lo - 1); hi = Math.min(reg, hi + 1);
  // 80% range and the win total where playoff odds pass 50%
  let c = 0, p10 = null, p90 = null;
  bins.forEach((b, w) => { c += b[0]; if (p10 == null && c >= N*.1) p10 = w; if (p90 == null && c >= N*.9) p90 = w; });
  const need = bins.findIndex((b, w) => b[0] >= N*.002 && b[1] / b[0] >= .5);
  const Wd = 640, H = 230, L = 40, R = 12, Tp = 14, B = 30;
  const n = hi - lo + 1, bw = (Wd - L - R) / n;
  const top = Math.ceil(maxS * 20) / 20 || .05;
  const Y = v => Tp + (1 - v / top) * (H - Tp - B);
  const ticks = []; for (let v = 0; v <= top + 1e-9; v += top > .2 ? .1 : .05) ticks.push(+v.toFixed(2));
  let svg = `<svg viewBox="0 0 ${Wd} ${H}" role="img" aria-label="Simulated final win totals for ${esc(row.name)}">`;
  svg += `<g class="grid">${ticks.map(v => `<line x1="${L}" x2="${Wd-R}" y1="${Y(v)}" y2="${Y(v)}"/>`).join('')}</g>`;
  svg += `<g class="axis">${ticks.map(v => `<text x="${L-8}" y="${Y(v)+4}" text-anchor="end">${Math.round(v*100)}%</text>`).join('')}</g>`;
  for (let w = lo; w <= hi; w++) {
    const x = L + (w - lo) * bw + 3, wd = Math.max(2, bw - 6), b = bins[w];
    const yAll = Y(b[0] / N), yMade = Y(b[1] / N), base = Y(0);
    if (b[0]) {
      if (b[1]) svg += `<rect x="${x}" y="${yMade}" width="${wd}" height="${Math.max(0, base - yMade)}" fill="var(--accent)" rx="2"/>`;
      if (b[0] > b[1]) svg += `<rect x="${x}" y="${yAll}" width="${wd}" height="${Math.max(0, (b[1] ? yMade - 2 : base) - yAll)}" fill="var(--line-quiet)" rx="2"/>`;
    }
    svg += `<text x="${x + wd/2}" y="${H - 10}" text-anchor="middle">${w}</text>`;
    svg += `<rect class="hitbar" data-w="${w}" x="${x - 3}" y="${Tp}" width="${bw}" height="${H - Tp - B}" fill="transparent"/>`;
  }
  svg += `</svg><div class="tip" hidden></div>`;
  host.innerHTML = `<div class="dist-head">
      <div><div class="eyebrow">${esc(row.name)} · 10,000 simulated seasons</div>
      <p class="ink2">Averages <b>${row.projW.toFixed(1)} wins</b>. In 8 of 10 simulations it finishes with <b>${p10}–${p90} wins</b>.${need >= 0 ? ` Teams that reach <b>${need} wins</b> usually make the playoffs here.` : ''}</p></div>
      <div class="legend"><span><i class="sw blk" style="background:var(--accent)"></i>Made playoffs (${pct(row.po)})</span><span><i class="sw blk" style="background:var(--line-quiet)"></i>Missed</span></div>
    </div><div class="chart">${svg}</div><p class="note">Bars show the share of simulated seasons ending with each number of wins. Ties are counted separately, not as half-wins.</p>`;
  const chart = host.querySelector('.chart'), tip = chart.querySelector('.tip'), svgEl = chart.querySelector('svg');
  chart.querySelectorAll('.hitbar').forEach(h => {
    const show = () => {
      const w = +h.dataset.w, b = bins[w];
      tip.innerHTML = `<div class="t">${w} wins</div><div class="rowt"><span>Share of seasons</span><span class="num">${pct(b[0]/N, 1)}</span></div><div class="rowt"><span>Made playoffs from here</span><span class="num">${b[0] ? pct(b[1]/b[0]) : '—'}</span></div>`;
      tip.hidden = false;
      const rect = svgEl.getBoundingClientRect(), hx = (+h.getAttribute('x') + bw/2) / Wd * rect.width, tw = tip.offsetWidth;
      tip.style.left = (hx + 12 + tw > rect.width ? Math.max(0, hx - tw - 12) : hx + 12) + 'px'; tip.style.top = '0px';
    };
    h.addEventListener('pointerenter', show); h.addEventListener('pointerdown', show);
    h.addEventListener('pointerleave', () => { tip.hidden = true; });
  });
}

function drawTimeline(host, hist, p, m, lock){
  const isPct = m !== 'projW';
  const Wd = 780, H = 400, L = 40, R = 200, Tp = 16, B = 34;
  const xs = hist.length - 1, T = p.season.teams.length;
  const series = p.season.teams.map((_, t) => hist.map(h => h[t][m]));
  let ymin, ymax;
  if (isPct) { ymin = 0; ymax = 1; }
  else { ymin = Math.floor(Math.min(...series.flat()) - .5); ymax = Math.ceil(Math.max(...series.flat()) + .5); }
  const X = i => L + (xs ? i/xs : .5) * (Wd - L - R);
  const Y = v => Tp + (1 - (v - ymin)/(ymax - ymin)) * (H - Tp - B);
  const ticks = []; const step = isPct ? .25 : (ymax - ymin > 8 ? 2 : 1);
  for (let v = ymin; v <= ymax + 1e-9; v += step) ticks.push(+v.toFixed(2));
  const fmt = v => isPct ? Math.round(v*100) + '%' : v.toFixed(0);
  const fmtV = v => isPct ? pct(v) : v.toFixed(1);
  const xTickEvery = xs > 12 ? 2 : 1;
  const path = arr => arr.map((v,i) => (i ? 'L' : 'M') + X(i).toFixed(1) + ' ' + Y(v).toFixed(1)).join('');
  const short = s => s.length > 19 ? s.slice(0, 18) + '…' : s;
  // End labels for every team, spread so none overlap
  const GAP = 14, lo = Tp + 4, hi = H - B;
  const lab = series.map((s, t) => ({ t, y: Y(s[xs]) })).sort((a, b) => a.y - b.y);
  for (let k = 0; k < lab.length; k++) lab[k].ly = Math.max(lab[k].y, k ? lab[k-1].ly + GAP : lo);
  const over = lab[lab.length-1].ly - hi;
  if (over > 0) for (let k = lab.length - 1; k >= 0; k--) lab[k].ly = Math.min(lab[k].ly, k === lab.length-1 ? hi : lab[k+1].ly - GAP);
  const ly = {}; lab.forEach(o => ly[o.t] = o.ly);

  let svg = `<svg viewBox="0 0 ${Wd} ${H}" role="img" aria-label="${isPct ? 'Playoff odds' : 'Projected wins'} by week for every team">`;
  svg += `<g class="grid">${ticks.map(v => `<line x1="${L}" x2="${Wd-R}" y1="${Y(v)}" y2="${Y(v)}"/>`).join('')}</g>`;
  svg += `<g class="axis">${ticks.map(v => `<text x="${L-8}" y="${Y(v)+4}" text-anchor="end">${fmt(v)}</text>`).join('')}`;
  for (let i = 0; i <= xs; i += xTickEvery) svg += `<text x="${X(i)}" y="${H-12}" text-anchor="middle">${i === 0 ? 'Pre' : 'W' + i}</text>`;
  svg += `</g><line class="xh" x1="0" x2="0" y1="${Tp}" y2="${H-B}" stroke="var(--rule-strong)" stroke-width="1" visibility="hidden"/>`;
  const order = [...Array(T).keys()].filter(t => t !== state.hl).concat(state.hl != null ? [state.hl] : []);
  order.forEach(t => {
    const c = teamColor(t), ex = X(xs), ey = Y(series[t][xs]);
    svg += `<g class="team${t === state.hl ? ' on' : ''}" data-t="${t}">
      <path class="ln" d="${path(series[t])}" fill="none" stroke="${c}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
      <circle cx="${ex}" cy="${ey}" r="3.5" fill="${c}" stroke="var(--surface)" stroke-width="1.5"/>
      <path d="M${ex+4} ${ey} L${ex+14} ${ly[t]}" stroke="${c}" stroke-width="1" fill="none" opacity=".6"/>
      <circle cx="${ex+20}" cy="${ly[t]}" r="4" fill="${c}"/>
      <text class="lb" x="${ex+28}" y="${ly[t]+4}">${esc(short(p.season.teams[t]))} <tspan class="v">${fmtV(series[t][xs])}</tspan></text>
      <path class="hitln" d="${path(series[t])}" fill="none" stroke="transparent" stroke-width="12"/>
      <rect class="hitlb" x="${ex+14}" y="${ly[t]-8}" width="${R-16}" height="15" fill="transparent"/>
    </g>`;
  });
  svg += `</svg><div class="tip" hidden></div>`;
  host.innerHTML = svg;
  host.classList.toggle('has-hl', state.hl != null);
  const svgEl = host.querySelector('svg'), tip = host.querySelector('.tip'), xh = host.querySelector('.xh');
  const groups = host.querySelectorAll('g.team');
  const peek = t => { host.classList.toggle('has-hl', t != null || state.hl != null); groups.forEach(g => g.classList.toggle('on', +g.dataset.t === (t ?? state.hl))); };
  groups.forEach(g => {
    const t = +g.dataset.t;
    g.querySelectorAll('.hitln,.hitlb').forEach(h => { h.addEventListener('pointerenter', () => peek(t)); h.addEventListener('pointerleave', () => peek(null)); h.addEventListener('click', () => lock(t)); });
  });
  svgEl.addEventListener('pointermove', e => {

// ---------- matchups ----------
function fmtCat(i, v){ const c = CATS[i]; if (c === 'FG%' || c === 'FT%') return v.toFixed(3).replace(/^0/, ''); return Math.round(v).toString(); }
function viewMatchups(el){

    } else if (liveS) chip = `<span class="chip live">Live · ${liveS.ca}–${liveS.cb}${liveS.cat.filter(x=>!x).length ? '–' + liveS.cat.filter(x=>!x).length : ''}</span>`;

      } else if (p.typical[i] != null) {
        va = fmtCat(i, projVal(p, E, m.a, i, w)); vb = fmtCat(i, projVal(p, E, m.b, i, w));
      } else { va = vb = '—'; }

    }).join('');

      <div class="vs"><div class="nm">${esc(p.season.teams[m.a])}</div><div></div><div class="nm b">${esc(p.season.teams[m.b])}</div>
      <div class="pct pa num">${pct(pr.p)}</div><div></div><div class="pct pb num">${pct(pr.q)}</div></div>

      <div class="cardmeta"><span>Projected <span class="num">${pr.exp.toFixed(1)}–${pr.expB.toFixed(1)}</span>${pr.tie >= .005 ? ` · tie ${pct(pr.tie)}` : ''}${p.season.games && w <= p.season.regWeeks ? ` · games <span class="num">${p.games(m.a, w)}–${p.games(m.b, w)}</span>` : ''}</span>${chip}</div>
      <div class="cats"><div class="cats-head">Cat</div><div class="cats-head">Chance by category</div><div class="cats-head">${shown ? (actual ? 'Final' : 'Live') : 'Proj.'}</div><div class="cats-head" style="text-align:right">&nbsp;</div>${catRows}</div>

  el.innerHTML = `<section class="section">
    <div class="sec-head"><div class="with-mascot"><span class="mascot-slot" data-mascot="stand"></span><div><div class="eyebrow">Weekly matchups</div><h2>Week ${w}</h2></div></div><p>${desc}${isFinal && decided ? ` The model picked <b>${hits} of ${decided}</b> correctly this week.` : ''}</p></div>

// ---------- teams ----------
// Relative strength: where each team sits between the league's worst (0) and best (1) team in a category.
function relative(E, T){
  const score = [], rank = [], avgScore = [];
  for (let i = 0; i < NC; i++) {
    const v = [...Array(T).keys()].map(t => SGN[i] * E.mu[t][i]);
    const lo = Math.min(...v), hi = Math.max(...v), span = hi - lo || 1;
    v.forEach((x, t) => {
      (score[t] ||= [])[i] = (x - lo) / span;
      (rank[t] ||= [])[i] = 1 + v.filter(y => y > x + 1e-12).length;
    });
    avgScore[i] = (SGN[i] * 1 - lo) / span; // league average sits at strength 1.0
  }
  return { score, rank, avgScore };
}
const ord = n => n + (n % 100 >= 11 && n % 100 <= 13 ? 'th' : ['th','st','nd','rd'][n % 10] || 'th');

function heatColor(rank, T){

function heatmap(p, RS){

function drawRadar(host, RS, A, B, T){
  const S = 440, cx = S/2, cy = S/2, R = 150, IN = .12;
  const ang = i => -Math.PI/2 + i * 2*Math.PI/NC;

  [0, 1/3, 2/3, 1].forEach(s => { svg += `<polygon points="${poly(CATS.map(() => s))}" fill="none" stroke="${s === 1 ? 'var(--rule-strong)' : 'var(--rule)'}" stroke-width="1"/>`; });
  CATS.forEach((c, i) => { const [x0, y0] = pt(i, 0), [x, y] = pt(i, 1); svg += `<line x1="${x0}" y1="${y0}" x2="${x}" y2="${y}" stroke="var(--rule)"/>`; });
  svg += `<polygon points="${poly(RS.avgScore)}" fill="none" stroke="var(--muted)" stroke-width="1.5" stroke-dasharray="4 4"/>`;

  });

// ---------- DuffTea ----------
// Each team's report, written from the model's numbers by fixed rules, so it refreshes with every weekly update.
const CAT_NAME = { 'FG%': 'field goal %', 'FT%': 'free throw %', '3PM': 'threes', REB: 'rebounds', AST: 'assists', STL: 'steals', BLK: 'blocks', TO: 'turnovers', PTS: 'points' };
const PRAISE = { 'FG%': 'Efficient shooting, nothing wasted.', 'FT%': 'Money at the line.', '3PM': 'It is raining threes.', REB: 'Owns the glass.',
  AST: 'The ball moves.', STL: 'Pickpockets, all of them.', BLK: 'Rim protection for days.', TO: 'Takes care of the ball.', PTS: 'Puts up points.' };
const ROAST = { 'FG%': 'Bricks are a building material, not a strategy.', 'FT%': 'Free throws have not been free.', '3PM': 'Allergic to the three-point line.',
  REB: 'Boxing out appears to be optional.', AST: 'Somebody on this roster has to pass.', STL: 'Hands not quite quick enough.', BLK: 'The rim is wide open.',
  TO: 'The ball is a hot potato.', PTS: 'Scoring is kind of the point.' };
const FIX = { 'FG%': 'An efficient big off waivers helps fastest.', 'FT%': 'Swap out the worst free-throw shooter, or lean into punting it.',
  '3PM': 'Threes are easy to stream: grab a shooter with a full schedule.', REB: 'One rebounding big moves this a lot.', AST: 'A pass-first guard is the quickest fix.',
  STL: 'Steals are streamable from guards and wings.', BLK: 'One shot-blocking center can swing this alone.', TO: 'Usually the price of volume. Fine to live with.',
  PTS: 'Volume scorers, and more games, both help.' };
const ord2 = n => n + (n % 100 >= 11 && n % 100 <= 13 ? 'th' : ['th','st','nd','rd'][n % 10] || 'th');
const fmtDay = iso => new Date(iso + 'T12:00:00').toLocaleDateString(undefined, { month: 'short', day: 'numeric' });

function teaFor(p, t){
  const T = p.T, w0 = p.lastFinal, E = estimate(p, w0), names = p.season.teams;
  const hist = history(p), now = hist[w0], prev = w0 ? hist[w0 - 1] : null;
  const me = now[t], trend = prev ? me.projW - prev[t].projW : 0;
  // effective weekly strength: per-game rate × usage for counting stats
  const eff = (u, i) => SGN[i] * E.mu[u][i] * (COUNT[i] ? E.usage[u] : 1);
  const rank = CATS.map((_, i) => 1 + [...Array(T).keys()].filter(u => eff(u, i) > eff(t, i) + 1e-12).length);
  // average chance to win each category against every other team, typical week
  const vsAll = CATS.map((_, i) => avg([...Array(T).keys()].filter(u => u !== t).map(u => {
    const fa = COUNT[i] ? E.usage[t] : 1, fb = COUNT[i] ? E.usage[u] : 1;
    const sd = Math.sqrt(2*SIG[i]*SIG[i] + (E.se[t][i]*fa)**2 + (E.se[u][i]*fb)**2);
    return phi(SGN[i] * (E.mu[t][i]*fa - E.mu[u][i]*fb) / sd);
  })));
  const byRank = CATS.map((c, i) => ({ c, i, r: rank[i], p: vsAll[i] })).sort((a, b) => a.r - b.r);
  const ranked = [...now].sort((x, y) => y.projW - x.projW || y.title - x.title).map(x => x.t);
  const place = ranked.indexOf(t) + 1;
  const usageRank = 1 + [...Array(T).keys()].filter(u => E.usage[u] > E.usage[t] + 1e-9).length;
  const reg = p.season.regWeeks, left = reg - w0;

  // headline
  const tier = me.po >= .7 ? 'contender' : me.po >= .4 ? 'mix' : me.po >= .15 ? 'bubble' : 'longshot';
  const dir = trend >= 1 ? 'up' : trend <= -1 ? 'down' : 'flat';
  const LINES = {
    contender: { up: 'Main character energy. The rest of the league is watching you.', flat: 'Comfortably near the top. Don\'t get bored.', down: 'Still a contender, but last week left a mark.' },
    mix: { up: 'Climbing. Keep this up and you\'re a real problem.', flat: 'Right in the thick of it. Every week matters.', down: 'Slipping into the pack. Time to tighten up.' },
    bubble: { up: 'Pulse detected. The playoffs are back on the table.', flat: 'On the bubble. A couple of good weeks changes everything.', down: 'Drifting the wrong way. The window\'s still open, barely.' },
    longshot: { up: 'Small signs of life. Long road, but it\'s a road.', flat: 'Long odds. Play spoiler and enjoy it.', down: 'Rough start. There\'s a lot of season left to make someone else miserable.' } };
  const verdict = { contender: 'Contender', mix: 'In the mix', bubble: 'Bubble', longshot: 'Long shot' }[tier];

  // doing right / doing wrong
  const strong = byRank.filter(x => x.r <= 4).slice(0, 3), weak = byRank.filter(x => x.r >= T - 3).slice(-3).reverse();
  const right = strong.map(x => `<b>${ord2(x.r)} in ${CAT_NAME[x.c]}.</b> ${PRAISE[x.c]}`);
  const wrong = weak.map(x => `<b>${ord2(x.r)} in ${CAT_NAME[x.c]}.</b> ${ROAST[x.c]}`);
  const lastPlayed = w0 ? p.played(t, w0) : null, lastSched = w0 ? p.games(t, w0) : null;
  if (w0 && p.season.games) {
    if (usageRank <= 3) right.push(`<b>${ord2(usageRank)} in the league at getting guys on the floor.</b> ${lastPlayed} of ${lastSched} scheduled games last week.`);
    else if (usageRank >= T - 2) wrong.push(`<b>${ord2(usageRank)} at getting scheduled games into the lineup.</b> ${lastPlayed} of ${lastSched} last week. That's free stats on the bench.`);
  }
  if (!right.length) right.push(`Nothing in the top four, but nothing's a disaster either. Best category: <b>${CAT_NAME[byRank[0].c]}</b> (${ord2(byRank[0].r)}).`);
  if (!wrong.length) wrong.push(`No category in the bottom three. Weakest spot: <b>${CAT_NAME[byRank[NC-1].c]}</b> (${ord2(byRank[NC-1].r)}).`);

  // over the season
  const season = [];
  if (left > 0) {
    const bins = p.season.dist && p.season.dist[t];
    if (bins) {
      const N = bins.reduce((s, b) => s + b[0], 0);
      const need = bins.findIndex(b => b[0] >= N * .002 && b[1] / b[0] >= .5);
      if (need >= 0) {
        const more = Math.max(0, need - me.w);
        season.push(more > left ? `Playoffs usually take about <b>${need} wins</b>. That's more than the weeks left, so ties and luck would have to break your way.`
          : `Playoffs usually take about <b>${need} wins</b>. You need <b>${more} more in ${left} weeks</b>, so roughly ${more}–${left - more} the rest of the way.`);
      }
    }
    const swing = CATS.map((c, i) => ({ c, i, p: vsAll[i] })).filter(x => x.c !== 'TO' && x.p > .3 && x.p < .55).sort((a, b) => Math.abs(a.p - .45) - Math.abs(b.p - .45))[0];
    if (swing) season.push(`<b>Best place to gain: ${CAT_NAME[swing.c]}.</b> You win it ${pct(swing.p)} of the time against a typical opponent, close enough that a small upgrade flips matchups. ${FIX[swing.c]}`);
    const punt = CATS.map((c, i) => ({ c, i, p: vsAll[i] })).filter(x => x.p < .25).sort((a, b) => a.p - b.p)[0];
    if (punt) season.push(`<b>Consider punting ${CAT_NAME[punt.c]}.</b> You win it only ${pct(punt.p)} of the time. Trading it away for help elsewhere could be worth more than chasing it.`);
    if (p.season.games && E.usage[t] < .98) {
      const lg = avg([...Array(T).keys()].map(u => E.usage[u]));
      const gain = Math.max(1, Math.round((lg - E.usage[t]) * (w0 ? p.games(t, Math.min(reg, w0 + 1)) : 40)));
      season.push(`<b>Stream more.</b> Getting to league-average usage is worth about ${gain} extra game${gain === 1 ? '' : 's'} a week, every week.`);
    }
  } else season.push('Regular season\'s over. See you next year.');

  // next week
  const next = [];
  const w = w0 + 1;
  const m = w <= reg && (p.weeks[w] || []).find(x => x.a === t || x.b === t);
  if (m) {
    const opp = m.a === t ? m.b : m.a, pr = matchupProb(p, E, t, opp, w);
    const mine = E.usage[t] * p.games(t, w), theirs = E.usage[opp] * p.games(opp, w);
    next.push(`<b>Week ${w} vs. ${esc(names[opp])}.</b> ${pct(pr.p)} to win${pr.tie >= .01 ? `, ${pct(pr.tie)} to tie` : ''}. Projected ${pr.exp.toFixed(1)}–${pr.expB.toFixed(1)} in categories.`);
    if (p.season.games) {
      const d = Math.round(mine - theirs);
      next.push(Math.abs(d) <= 1 ? `Games look even, about ${Math.round(mine)} each.`
        : d > 0 ? `You should get about <b>${d} more games</b> in (${Math.round(mine)} to ${Math.round(theirs)}). Use them.`
        : `They should get about <b>${-d} more games</b> in (${Math.round(theirs)} to ${Math.round(mine)}). Stream to close the gap.`);
    }
    const swing = pr.ps.map((x, i) => ({ c: CATS[i], x })).filter(o => Math.abs(o.x - .5) < .15).sort((a, b) => Math.abs(a.x - .5) - Math.abs(b.x - .5)).slice(0, 3);
    if (swing.length) next.push(`<b>Coin flips:</b> ${swing.map(o => `${CAT_NAME[o.c]} (${pct(o.x)})`).join(', ')}. That's where the week is decided.`);
    const locks = pr.ps.map((x, i) => ({ c: CATS[i], x })).filter(o => o.x >= .75).map(o => CAT_NAME[o.c]);
    const gone = pr.ps.map((x, i) => ({ c: CATS[i], x })).filter(o => o.x <= .25).map(o => CAT_NAME[o.c]);
    if (locks.length) next.push(`Likely yours: ${locks.join(', ')}.`);
    if (gone.length) next.push(`Likely theirs: ${gone.join(', ')}. Don't chase these.`);
    const inj = (p.season.injuries || []).filter(x => (x.team === t || x.team === opp) && (x.back === 'season' || x.back === 'unknown' || x.back > DATA.updated));
    inj.forEach(x => next.push(`${x.team === t ? 'Your' : 'Their'} ${esc(x.name)}: ${x.back === 'season' ? 'out for the season' : x.back === 'unknown' ? 'out, no return date' : `expected back ${fmtDay(x.back)}`}.`));
  } else next.push('No regular-season game next week.');

  // plain summary line: projected record, movement since last week, best and worst category
  const projWins = Math.round(me.projW + Math.max(0, me.projT - me.ti) / 2), projLoss = reg - me.ti - projWins;
  const move = !prev ? '' : Math.abs(trend) < .3 ? ', about the same as last week' : `, ${trend > 0 ? 'up' : 'down'} ${Math.abs(trend).toFixed(1)} wins from last week`;
  const summary = `Projected ${projWins}–${projLoss}${me.ti ? '–' + me.ti : ''}${move}. Strongest in ${CAT_NAME[byRank[0].c]}, weakest in ${CAT_NAME[byRank[NC-1].c]}.`;
  return { me, place, verdict, tier, line: summary, trend, right, wrong, season, next };
}

function viewTea(el){
  const p = P(), now = history(p)[p.lastFinal];
  const order = [...now].sort((x, y) => y.projW - x.projW || y.title - x.title).map(x => x.t);
  if (state.tea == null || state.tea >= p.T) state.tea = order[0];
  const t = state.tea, tea = teaFor(p, t), me = tea.me;
  const list = arr => `<ul>${arr.map(x => `<li>${x}</li>`).join('')}</ul>`;
  el.innerHTML = `<section class="section">
    <div class="sec-head"><div class="with-mascot"><span class="mascot-slot" data-mascot="stand"></span><div><div class="eyebrow">DuffTea · after week ${p.lastFinal}</div><h2>Spill it</h2></div></div>
      <p>What each team is doing right, what it's doing wrong, and what to do about it. Written from DuffCast's numbers, so it changes every week.</p></div>
    <div class="teapicks" role="group" aria-label="Team">${order.map(u => `<button type="button" aria-pressed="${u === t}" data-t="${u}"><i class="dot" style="background:${teamColor(u)}"></i>${esc(p.season.teams[u])}</button>`).join('')}</div>
    <article class="panel teacard fade">
      <header class="tea-head">
        <div>
          <div class="eyebrow">${ord2(tea.place)} projected · ${me.w}–${me.l}${me.ti ? '–' + me.ti : ''} so far</div>
          <h3><i class="dot" style="background:${teamColor(t)}"></i>${esc(me.name)}</h3>
          <p class="tea-line">${tea.line}</p>
        </div>
        <div class="tea-stats">
          <span class="chip tier-${tea.tier}">${tea.verdict}</span>
          <span><b class="num">${pct(me.po)}</b> playoffs</span>
          <span><b class="num">${pct(me.title)}</b> title</span>
        </div>
      </header>
      <div class="tea-grid">
        <div><h4>Doing right</h4>${list(tea.right)}</div>
        <div><h4>Doing wrong</h4>${list(tea.wrong)}</div>
        <div><h4>Over the season</h4>${list(tea.season)}</div>
        <div><h4>Next week</h4>${list(tea.next)}</div>
      </div>
    </article>
    <p class="note">Category ranks combine how good each team's players are per game with how many games it gets into the lineup. All in good fun.</p>
  </section>`;
  el.querySelectorAll('.teapicks button').forEach(b => b.onclick = () => { state.tea = +b.dataset.t; viewTea(el); });
}

// ---------- model ----------
function viewModel(el){
  const bt = PREPS.map(pp => ({ pp, r: backtest(pp) }));
  const last = bt.find(x => x.pp.season.id === '2026') || bt[bt.length - 1];
  const cur = bt.find(x => x.pp.season.id === '2027');
  const D = last.r, C = cur && cur.r.n ? cur.r : null;
  const cell = r => r ? `${r.hit} of ${r.n} <span class="muted">(${pct(r.hit / r.n)})</span>` : '<span class="muted">—</span>';
  el.innerHTML = `<section class="section">
    <div class="sec-head"><div class="with-mascot"><span class="mascot-slot" data-mascot="stand"></span><div><div class="eyebrow">How it works</div><h2>How DuffCast works</h2></div></div></div>
    <div class="prose">
      <p>DuffCast looks at each team's category totals every week, leans on recent weeks, and works out who should win more categories. Then it plays out the rest of the season thousands of times to get playoff and title odds.</p>
    </div>
    <div class="prose">
      <h3>1. Strength is measured per game, against the league</h3>
      <p>For counting stats, DuffCast divides each team's weekly total by the number of games its players actually played, using ESPN's daily lineups, then compares that with the league's per-game average for the week. FG% and FT% get compared directly. Older weeks fade at <b>80% per week</b>, which tested best on last season.</p>
      <h3>2. How many games you get is partly on you</h3>
      <p>When I tested last season, it turned out that the number of games a team gets into its lineup is very consistent week to week. Some of us stream and fill every slot; some of us don't. So DuffCast tracks each team's usage rate: the share of its scheduled games it actually got into the lineup, compared with the rest of the league, weighted toward recent weeks. A short-handed week from injuries lowers it for a while, then it recovers.</p>
      <h3>3. Each week is projected from the real schedule, injuries included</h3>
      <p>A team's projected games for a week are its scheduled games times its usage rate. Scheduled games come from current rosters and the NBA schedule, counting at most 10 players a day. Anyone in the IR slot is left out. Injured players are left out only until ESPN's expected return date, so a guy who misses one game counts again the next day, while a torn Achilles counts as out for the season. If there's no return date, I assume two weeks. If you have someone hurt for a week or more and your IR spot is open, DuffCast assumes you'll stash him and pick someone up off waivers. That pickup counts as a player with an average schedule who produces about 75% of a typical rostered player.</p>
      <h3>4. Small samples get pulled toward average</h3>
      <p>One hot week mostly reflects luck and a few big games, so each team's numbers are blended with league average until there's more data. How much depends on the category. Steals and blocks swing a lot week to week, so a big week there counts for less than a big week in rebounds. FG% and FT% barely separate teams in any single week, so it takes about seven weeks before DuffCast trusts them.</p>
      <h3>5. Wins are odds, then simulated</h3>
      <p>For every matchup, DuffCast works out each team's chance to win, tie or lose each of the nine categories, and from that the chance of winning the week. Then it plays out the rest of the season <b>10,000 times</b>, playoffs included, using our four-team, two-week bracket. Each run also re-rolls how good every team really is, and lets every team's strength drift a little each simulated week, because rosters, injuries and slumps change things over a season.</p>
      <h3>6. Forecasts are frozen each week</h3>
      <p>I run the simulations once a week when results come in and save them. Everyone sees the same odds, and past weeks keep exactly what DuffCast said at the time, even if I change the model later.</p>
      <h3>What it doesn't know</h3>
      <p>Team strength comes from results, not player projections. After a big trade, the schedule part updates right away, but the strength ratings take a week or two to catch up. Injury return dates are ESPN's estimates, and they move. The 75% waiver pickup is my guess, not something measured from our league, and I couldn't test the injury pieces on last season because ESPN doesn't keep old injury reports. The NBA Cup knockout weeks in December show fewer games until those matchups are set.</p>
    </div>
  </section>
  <section class="section">
    <div class="sec-head"><div><div class="eyebrow">Backtest</div><h2>How it has done</h2></div></div>
    <div class="panel tbl-wrap">
      <table class="score">
        <thead><tr><th></th><th>Last season, weeks 2–19</th><th>This season so far</th></tr></thead>
        <tbody>
          <tr><td>Matchups called correctly<span class="sub">Each week predicted using only earlier weeks</span></td><td class="num">${cell(D)}</td><td class="num">${cell(C)}</td></tr>
          <tr><td>When it was 70%+ sure<span class="sub">How often those confident calls came true</span></td><td class="num">${D.conf ? `${D.confHit} of ${D.conf} <span class="muted">(${pct(D.confHit / D.conf)})</span>` : '—'}</td><td class="num">${C && C.conf ? `${C.confHit} of ${C.conf}` : '<span class="muted">—</span>'}</td></tr>
          <tr class="key"><td>Brier score<span class="sub">Lower is better. A coin flip scores 0.250.</span></td><td class="num good">${D.brier.toFixed(3)}</td><td class="num">${C ? C.brier.toFixed(3) : '<span class="muted">—</span>'}</td></tr>
        </tbody>
      </table>
    </div>
    <div class="prose">
      <p><b>What this shows.</b> I replayed all of last season from ESPN, predicting each week using only the weeks before it. DuffCast called ${D.hit} of ${D.n} matchups. The Brier score measures how far its stated chances were from what actually happened: saying 100% and being wrong costs a full point, while saying 60% and being wrong costs 0.36. When DuffCast said 70% or better last season, it was right ${D.confHit} of ${D.conf} times, so its odds can be taken at face value. This season's column is only a few weeks of games, so expect it to bounce around.</p>
    </div>
  </section>`;
}

// ---------- router ----------
const VIEWS = { standings: viewStandings, matchups: viewMatchups, teams: viewTeams, tea: viewTea, model: viewModel };
function render(){
  const h = location.hash.slice(1);
  state.view = VIEWS[h] ? h : 'standings';
  if (state.a == null) defaultFocus();
  renderMast();
  VIEWS[state.view]($('#view'));
}
window.addEventListener('hashchange', render);
new MutationObserver(() => document.querySelectorAll('.mascot-slot:not([data-ready])').forEach(fillMascot)).observe(document.getElementById('view'), { childList: true, subtree: true });
if (state.s >= PREPS.length) state.s = 0;
render();
})();
</script>

</body>
</html>
